{# Sub-tab bar for the Tools section. Pages set {% set tools_tab = '...' %}
   (or pass tools_tab from the view) before including this. Self-contained:
   the rules live here rather than in style.css because nothing outside
   /tools/ uses them. #}
<style>
  .tools-subtabs {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 20px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .tools-subtab {
    display: inline-block;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .tools-subtab:hover { color: var(--text-strong); background: var(--surface-3); }
  .tools-subtab.is-active {
    color: var(--accent);
    background: var(--surface-3);
    border-color: var(--border-hi);
  }
  /* Unused at present; kept for flagging a freshly added tool. */
  .tools-subtab-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--on-accent);
    background: var(--accent);
    padding: 1px 5px;
    margin-left: 7px;
    vertical-align: 1px;
  }
  @media (max-width: 700px) {
    .tools-subtabs { padding: 12px 14px 0; }
    .tools-subtab { padding: 6px 12px; font-size: 12px; }
  }
</style>
<nav class="tools-subtabs" aria-label="{{ _('Tools sections') }}">
  <a class="tools-subtab{% if tools_tab | default('extensions') == 'extensions' %} is-active{% endif %}"
     href="{{ url_for('tools_page') }}">{{ _('Extensions') }}</a>
  <a class="tools-subtab{% if tools_tab | default('') == 'solver' %} is-active{% endif %}"
     href="{{ url_for('tools_solver_page') }}">{{ _('Spread Solver') }}</a>
</nav>
