<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | MunchStats</title>
    <meta property="og:title" content="Page Not Found | MunchStats">
    <meta name="description" content="The page you're looking for doesn't exist.">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 40px 20px;
        max-width: 600px;
      }
      h1 {
        font-size: 72px;
        color: var(--text-strong);
        margin-bottom: 10px;
      }
      h2 {
        font-size: 24px;
        color: var(--text-soft);
        margin-bottom: 20px;
        font-weight: normal;
      }
      p {
        font-size: 16px;
        color: var(--text-faint);
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .home-button {
        background-color: var(--surface);
        color: var(--text);
        border: 1px solid var(--border-2);
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
        text-decoration: none;
        display: inline-block;
      }
      .home-button:hover {
        background-color: var(--raised);
        color: var(--text-strong);
      }
      .footer {
        position: absolute;
        bottom: 20px;
        text-align: center;
        font-size: 12px;
        color: var(--text-disabled);
      }
      .footer a {
        color: var(--text-faint);
        text-decoration: none;
      }
      .footer a:hover {
        color: var(--text-strong);
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K1B7P5XXK6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-K1B7P5XXK6");
    </script>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="{{ url_for('index') }}" class="home-button">Go back to the homepage</a>
    </div>
    <div class="footer">
      <p><a href="/about">About</a></p>
      <p>Pok&eacute;mon and All Respective Names are Trademark &amp; &copy; of Nintendo 1996-2026</p>
    </div>
  </body>
</html>
